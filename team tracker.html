<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roller Derby Penalty Tracker</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="container" id="container">
        <header>
            <h1>🛼 Penalty Wrangler</h1>
            <p class="subtitle">Track roller derby penalties in real-time</p>
        </header>

        <div id="penaltyTracker">
            <!-- Penalty entries will be added here -->
        </div>

        <div class="actions">
            <button class="add-btn" onclick="addPenaltyEntry()">
                <span class="btn-icon">+</span> Add Penalty
            </button>
            <button class="clear-btn" onclick="clearAll()">
                <span class="btn-icon">🗑️</span> Clear All
            </button>
        </div>

        <div class="summary" id="summary">
            <h3>Penalty Summary</h3>
            <div id="summaryContent">
                <p class="empty-message">No penalties recorded yet</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
